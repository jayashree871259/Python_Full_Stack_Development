<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logout Successful</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 20px;
    }

    .logout-container {
      background: #1e293b;
      border: 1px solid #334155;
      width: 100%;
      max-width: 400px;
      padding: 44px 32px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .success-icon {
      width: 68px;
      height: 68px;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      margin: 0 auto 24px;
    }

    h1 {
      color: #f8fafc;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .login-btn {
      display: block;
      width: 100%;
      text-decoration: none;
      background: #3b82f6;
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .login-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 24px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="logout-container">
    <div class="success-icon">✓</div>
    <h1>Logged Out Successfully!</h1>
    <p>
      You have successfully logged out of your account. Thank you for visiting us. We hope to see you again soon!
    </p>
    <a href="{% url 'login' %}" class="login-btn">Login Again</a>
    <div class="footer">Thank you for using our website!</div>
  </div>
</body>
</html>
