
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc;
            padding: 20px;
        }

        .dashboard-container {
            background: #1e293b;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
            padding: 44px 32px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .welcome-icon {
            width: 68px;
            height: 68px;
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 24px;
        }

        h1 {
            color: #f8fafc;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        h1 span {
            color: #10b981;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .logout-btn {
            display: block;
            width: 100%;
            text-decoration: none;
            background: #3b82f6;
            color: #ffffff;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .logout-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 24px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .dashboard-container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">

        <div class="welcome-icon">✓</div>

        <h1>
            Welcome <span>{{ request.user.username }}</span>!
        </h1>

        <p>
            You have successfully logged in to your account.
            Welcome to our website. We are happy to have you here!
        </p>

        <form action="{% url 'logout' %}" method="POST">
            {% csrf_token %}
            <button type="submit" class="logout-btn">
                Logout
            </button>
        </form>

        <div class="footer">
            Thank you for visiting our website!
        </div>

    </div>

</body>
</html>
