
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 20px;
    }

    form {
      background: #1e293b;
      border: 1px solid #334155;
      width: 100%;
      max-width: 400px;
      padding: 44px 32px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-icon {
      width: 68px;
      height: 68px;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      margin: 0 auto 24px;
    }

    h2 {
      color: #f8fafc;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 9px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 23px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    button {
      display: block;
      width: 100%;
      padding: 14px 24px;
      margin-top: 5px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 24px;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      form {
        padding: 35px 25px;
      }
    }
  </style>
</head>

<body>

  <form method="POST">
    {% csrf_token %}

    <div class="login-icon">🔐</div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">
      Please enter your details to sign in
    </p>

    <label for="username">Username</label>

    <input
      type="text"
      id="username"
      name="username"
      placeholder="Enter your username"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      name="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">Login</button>

    <div class="footer">
      Secure Login | Welcome to Our Website!
    </div>

  </form>

</body>
</html>
